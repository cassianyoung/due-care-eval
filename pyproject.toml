[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "due-care"
version = "1.1.0"
description = "The excuse test and the duty test, as Inspect tasks"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
  "inspect-ai==0.3.270",
  "numpy>=1.26",
]

[project.optional-dependencies]
local = [
  "torch>=2.4",
  "transformers>=4.51",
  "peft>=0.13",
  "huggingface_hub>=0.26",
  "safetensors>=0.4",
  "accelerate>=0.34",
]

[project.entry-points.inspect_ai]
due_care = "due_care._registry"

[tool.setuptools]
packages = ["due_care", "due_care.tasks", "harness", "db", "due_care.banks", "due_care.models"]

# The banks and the ready-made model entries are data the package reads at run time. In a
# checkout they are banks/ and models/ at the root; a wheel ships them inside the package
# as due_care/banks and due_care/models (never as top-level "banks" or "models", which
# would collide with other projects). harness.frames.data_dir() picks whichever applies.
[tool.setuptools.package-dir]
"due_care.banks" = "banks"
"due_care.models" = "models"

[tool.setuptools.package-data]
"due_care.banks" = ["*.json", "*.jsonl"]
"due_care.models" = ["*.json"]
